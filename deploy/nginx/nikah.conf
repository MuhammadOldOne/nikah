# «Никах Истина» behind the server's existing nginx (docs/DEPLOY.md, «Режим nginx»).
#
# 1. Replace example.ru with the domain (server_name) and, if WEB_HOST_PORT in .env is not 8000,
#    the port in "upstream".
# 2. cp deploy/nginx/nikah.conf /etc/nginx/sites-available/nikah.conf
#    ln -s /etc/nginx/sites-available/nikah.conf /etc/nginx/sites-enabled/nikah.conf
#    nginx -t && systemctl reload nginx
# 3. HTTPS certificate (certbot adds "listen 443 ssl", the certificate and the redirect from http
#    to this server block, and renews it automatically):
#    apt install -y certbot python3-certbot-nginx
#    certbot --nginx -d example.ru --redirect
#
# The website is published by docker-compose.nginx.yml on 127.0.0.1 only.

# Access log without query strings and referers: /auth/* carries login tokens and the Telegram Login
# Widget's data (Telegram id, name, username), which the app keeps out of its own log as well
# (sites-enabled files are read inside http {}, where log_format and map belong).
log_format nikah_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_user_agent"';
# One-time login links carry the token in the path itself: not logged at all.
map $uri $nikah_loggable {
    ~^/auth/magic/  0;
    default         1;
}

upstream nikah_web {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.ru;

    # The site only accepts small forms.
    client_max_body_size 1m;
    server_tokens off;

    access_log /var/log/nginx/nikah.access.log nikah_noquery if=$nikah_loggable;
    error_log /var/log/nginx/nikah.error.log;

    location / {
        proxy_pass http://nikah_web;

        # HTTP/1.1 with keep-alive to the app (required for long-lived responses).
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Live chat uses Server-Sent Events: pass every chunk at once and keep the stream open.
        # (Do not add text/event-stream to gzip_types anywhere: compression buffers the stream.)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
