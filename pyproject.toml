[project]
name = "nikah-istina"
version = "0.1.0"
description = "Никах-платформа «Истина»: сайт и Telegram-бот @nikah_istina_bot на общей базе данных"
requires-python = ">=3.12"
readme = "docs/MVP.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run: the SQLAlchemy engine pool and asyncpg
# connections are bound to the loop they were created on.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "ASYNC109"]
